name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn build
      - run: yarn test:unit
      - name: Verify tracked inputs remain immutable
        run: git diff --exit-code

  browser-unit-tests:
    name: Chromium unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: yarn exec playwright install --with-deps chromium
      - run: yarn test:unit:browser

  package-proof:
    name: Local package proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build local prerelease artifacts
        env:
          BLOCKSUITE_ARTIFACT_DIR: ${{ runner.temp }}/cw-blocksuite-artifacts
        run: yarn build:packages
      - name: Verify a disposable consumer can install and link the artifacts
        env:
          BLOCKSUITE_ARTIFACT_DIR: ${{ runner.temp }}/cw-blocksuite-artifacts
        run: yarn verify:consumer
      - name: Verify source and tracked inputs remain unchanged
        run: git diff --exit-code
