name: PR Auto Assign

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  assign:
    name: Assign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: kentaro-m/auto-assign-action@f4648c0a9fdb753479e9e75fc251f507ce17bb7e # v2.0.0
